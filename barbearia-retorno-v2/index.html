<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b2a"><title>Barbearia do Vinícius — Central de Recorrência</title><style>:root{--b:#08a9e6;--b2:#087fb6;--n:#071b2a;--ink:#173044;--m:#708493;--bg:#f4f8fb;--line:#dce8ef;--ok:#17845e;--warn:#a96b07;--vio:#6159b6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hide{display:none!important}.gate{min-height:100dvh;display:grid;grid-template-columns:1.05fr .95fr}.brand{padding:52px;color:#fff;background:radial-gradient(circle at 20% 15%,#0f90c6 0,transparent 34%),linear-gradient(145deg,#071b2a,#0b3550);display:flex;flex-direction:column;justify-content:space-between}.logo{display:inline-block;background:var(--b);padding:13px 19px;border-radius:16px;font-weight:950;font-size:24px;letter-spacing:-.04em;box-shadow:0 14px 34px #0003}.logo small{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.78;margin-top:2px}.hero h1{font-size:58px;line-height:.96;letter-spacing:-.055em;margin:0 0 16px;max-width:720px}.hero p{color:#c7dce7;max-width:620px;line-height:1.65}.loginwrap{display:grid;place-items:center;padding:38px;background:#fbfdfe}.login{width:min(420px,100%)}.lock{width:52px;height:52px;border-radius:15px;background:#e8f8ff;color:var(--b2);display:grid;place-items:center;font-size:23px}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:950;color:var(--b2);margin-top:18px}.login h2{font-size:31px;letter-spacing:-.04em;margin:6px 0 8px}.login p{color:var(--m);line-height:1.6}.pin{width:100%;height:58px;border:1px solid #cbdce5;border-radius:14px;text-align:center;font-size:22px;font-weight:950;letter-spacing:.22em;background:#fff}.enter{width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;font-weight:950;margin-top:10px}.err{height:22px;color:#b84049;font-size:11px;font-weight:850;padding-top:6px}.note{border-top:1px solid var(--line);padding-top:14px;margin-top:12px;color:#8798a3;font-size:10px;line-height:1.5}.app{min-height:100dvh;display:grid;grid-template-columns:240px 1fr}.side{height:100dvh;position:sticky;top:0;background:linear-gradient(#071b2a,#0a293e);color:#fff;padding:17px 13px;display:flex;flex-direction:column}.side .logo{font-size:18px;padding:10px 13px;border-radius:13px}.nav{display:grid;gap:5px;margin-top:24px}.nav button{border:0;background:transparent;color:#9ab7c7;padding:12px 13px;text-align:left;border-radius:11px;font-weight:850}.nav button.on{background:#08a9e625;color:#fff}.secure{margin-top:auto;border:1px solid #fff2;border-radius:12px;padding:11px;color:#8eafc0;font-size:10px;line-height:1.5}.secure strong{color:#d9eef8}.logout{margin-top:8px;border:1px solid #fff2;background:transparent;color:#9bb6c6;border-radius:10px;height:36px;font-weight:850;font-size:11px}.main{min-width:0}.top{position:sticky;top:0;z-index:10;background:#f4f8fbef;backdrop-filter:blur(10px);border-bottom:1px solid #dce8efaa;padding:18px 25px 12px;display:flex;justify-content:space-between;align-items:end;gap:14px}.top h1{margin:2px 0;font-size:31px;letter-spacing:-.045em}.sub{color:var(--m);font-size:11px}.topright{display:flex;gap:8px}.sel,.btn,.inp{height:40px;border-radius:11px}.sel,.inp{border:1px solid var(--line);background:#fff;padding:0 10px;color:var(--ink)}.btn{border:0;padding:0 12px;font-weight:900}.btn.pri{background:var(--b);color:#fff}.btn.sec{background:#e7f7fd;color:#087dac}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.content{padding:17px 25px 90px;max-width:1440px;margin:auto}.focus{background:linear-gradient(125deg,#092438,#0b3d5b 65%,#0876a5);color:#fff;border-radius:21px;padding:23px 25px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;box-shadow:0 15px 35px #071b2a14}.focus h2{font-size:28px;letter-spacing:-.04em;margin:4px 0 6px}.focus p{margin:0;color:#bdd6e4;font-size:12px;line-height:1.5}.big{font-size:64px;font-weight:950;letter-spacing:-.06em}.biglabel{font-size:9px;color:#bee5f4;text-align:right}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:11px 0 23px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 5px 15px #071b2a08}.stat .l{color:var(--m);font-size:8px;text-transform:uppercase;letter-spacing:.08em;font-weight:950}.stat .v{font-size:28px;font-weight:950;letter-spacing:-.05em;margin:7px 0 3px}.stat .x{font-size:9px;color:#8ba0ad}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:23px 0 9px}.head h2{font-size:18px;margin:0 0 2px}.head p{margin:0;color:var(--m);font-size:10px}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:950;background:#edf3f6;color:#536978}.badge.first{background:#e6f7fd;color:#087fab}.badge.second{background:#fff4dd;color:var(--warn)}.badge.ok{background:#e8f8f1;color:var(--ok)}.badge.info{background:#efefff;color:var(--vio)}.queue,.clientgrid{display:grid;gap:8px}.card,.clientrow{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:0 6px 17px #071b2a07}.card{display:grid;grid-template-columns:minmax(220px,1.5fr) 105px 115px auto;gap:11px;align-items:center}.who{display:flex;gap:10px;align-items:center;min-width:0}.av{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:#e9f8ff;border:1px solid #d0eaf4;color:var(--b2);font-size:11px;font-weight:950}.nm{font-size:14px;font-weight:950}.meta{font-size:10px;color:var(--m);margin-top:3px}.ml{font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:#8a9ba6;font-weight:950}.mv{font-size:12px;font-weight:850;margin-top:3px}.acts{display:flex;gap:6px}.acts .btn{height:35px;font-size:10px}.toolbar{display:grid;grid-template-columns:1.5fr .85fr .7fr auto;gap:8px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px;margin-bottom:10px}.clientrow{display:grid;grid-template-columns:1.5fr .7fr .7fr .7fr;gap:10px;align-items:center}.panelgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.panel h2{font-size:17px;margin:0 0 4px}.fun{display:grid;gap:11px;margin-top:15px}.fr{display:grid;grid-template-columns:125px 1fr 28px;gap:8px;align-items:center;font-size:10px;font-weight:850}.track{height:9px;background:#edf3f6;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--b),var(--b2));border-radius:99px}.list{display:grid;gap:7px;margin-top:14px}.lr{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px}.modalbg{position:fixed;inset:0;background:#04131fcc;z-index:60;display:grid;place-items:center;padding:16px}.modal{width:min(560px,100%);max-height:90dvh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 25px 70px #0005}.mh{padding:16px 18px 11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.mh h3{margin:2px 0}.close{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:10px}.mb{padding:16px 18px 20px}.msg{background:#f4fafc;border:1px solid var(--line);padding:12px;border-radius:12px;font-size:11px;line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left}.choice strong{display:block;font-size:12px;margin-bottom:3px}.choice small{color:var(--m);font-size:9px}.bottom{display:none}.toast{position:fixed;right:18px;bottom:18px;background:var(--n);color:#fff;border-radius:11px;padding:10px 12px;font-size:10px;font-weight:850;z-index:99}@media(max-width:900px){.gate{grid-template-columns:1fr}.brand{min-height:285px;padding:27px}.hero h1{font-size:40px}.hero p{font-size:13px}.loginwrap{padding:28px 19px 44px}.app{grid-template-columns:1fr}.side{display:none}.top{padding:13px 14px 10px;align-items:start}.top h1{font-size:27px}.content{padding:13px 14px 90px}.stats{grid-template-columns:repeat(2,1fr)}.card{grid-template-columns:1fr 95px 105px}.acts{grid-column:1/-1}.acts .btn{flex:1}.panelgrid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar .inp:first-child{grid-column:1/-1}.clientrow{grid-template-columns:1fr 1fr}.bottom{display:grid;position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:40;grid-template-columns:repeat(3,1fr);background:#071b2af2;padding:6px;border-radius:16px;box-shadow:0 16px 40px #0004}.bottom button{border:0;background:transparent;color:#92b3c5;border-radius:10px;padding:9px 4px;font-size:10px;font-weight:850}.bottom button.on{background:#08a9e62e;color:#fff}}@media(max-width:600px){.brand{min-height:240px;padding:20px}.logo{font-size:19px}.hero h1{font-size:31px;margin-top:25px}.hero p{font-size:12px}.top{display:grid;gap:9px}.topright{width:100%;display:grid;grid-template-columns:1fr auto}.focus{padding:17px;grid-template-columns:1fr auto}.focus h2{font-size:21px}.focus p{font-size:10px}.big{font-size:45px}.biglabel{display:none}.stat{padding:12px}.stat .v{font-size:24px}.card{grid-template-columns:1fr 1fr}.who{grid-column:1/-1}.acts{display:grid;grid-template-columns:1fr 1fr}.acts .btn:last-child:nth-child(3){grid-column:1/-1}.toolbar{grid-template-columns:1fr 1fr}.clientrow{grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}.modalbg{align-items:end;padding:0}.modal{width:100%;border-radius:20px 20px 0 0}.toast{left:12px;right:12px;bottom:82px;text-align:center}}</style></head><body><div id="root"></div><script>const D={pin:'12345',tab:'today',barber:'all',clients:[{name:'Gabriel Quintanilha',barber:'Vinícius',phone:'5512999990001',last:'03/08',cycle:31,next:'03/09',status:'first',label:'1ª abordagem'},{name:'Marcos Vieira',barber:'Pedro',phone:'5512999990010',last:'02/08',cycle:30,next:'01/09',status:'second',label:'2ª abordagem'},{name:'Ricardo Almeida',barber:'Vinícius',phone:'5512999990002',last:'05/08',cycle:30,next:'04/09',status:'ok',label:'Agendado'},{name:'Enzo Martins',barber:'Matheus',phone:'5512999990004',last:'02/08',cycle:31,next:'02/09',status:'info',label:'Respondeu'},{name:'Lucas Ferreira',barber:'João',phone:'5512999990003',last:'21/08',cycle:15,next:'05/09',status:'first',label:'1ª abordagem'},{name:'Caio Ribeiro',barber:'Vinícius',phone:'5512999990006',last:'21/08',cycle:21,next:'11/09',status:'',label:'Em breve'}]};const root=document.querySelector('#root');let auth=sessionStorage.getItem('bv_auth')==='ok';function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1800)}function init(n){return n.split(' ').slice(0,2).map(x=>x[0]).join('')}function badge(c){return `<span class="badge ${c.status}">${c.label}</span>`}function nav(k,l){return `<button data-tab="${k}" class="${D.tab===k?'on':''}">${l}</button>`}function filtered(){return D.clients.filter(c=>D.barber==='all'||c.barber===D.barber)}function gate(){root.innerHTML=`<main class="gate"><section class="brand"><div class="logo">Barbearia do Vinícius<small>Central de recorrência</small></div><div class="hero"><h1>O cliente certo, no momento certo.</h1><p>Uma visão simples de quem está perto de voltar, quem já foi abordado e quais contatos viraram agendamento.</p></div></section><section class="loginwrap"><form class="login" id="login"><div class="lock">⌾</div><div class="ey">Acesso restrito</div><h2>Entrar na plataforma</h2><p>Digite o código da barbearia para visualizar a fila de relacionamento.</p><input class="pin" id="pin" maxlength="5" inputmode="numeric" placeholder="Digite o código"><button class="enter">Acessar plataforma</button><div class="err" id="err"></div><div class="note">● Protótipo demonstrativo. Código de acesso: 12345.</div></form></section></main>`;let p=document.querySelector('#pin');p.oninput=()=>p.value=p.value.replace(/\D/g,'').slice(0,5);document.querySelector('#login').onsubmit=e=>{e.preventDefault();if(p.value===D.pin){sessionStorage.setItem('bv_auth','ok');auth=true;render()}else{document.querySelector('#err').textContent='Código incorreto.'}}}function shell(body,title){root.innerHTML=`<div class="app"><aside class="side"><div class="logo">Barbearia do Vinícius<small>Central de recorrência</small></div><nav class="nav">${nav('today','⌂ Hoje')}${nav('clients','◎ Clientes')}${nav('results','↗ Resultados')}</nav><div class="secure"><strong>● Sessão protegida</strong><br>Dados demonstrativos.</div><button class="logout" data-lock>Bloquear acesso</button></aside><main class="main"><header class="top"><div><div class="ey">Central de recorrência</div><h1>${title}</h1><div class="sub">Quinta-feira, 03 de setembro</div></div><div class="topright"><select class="sel" id="barber"><option value="all">Todos os barbeiros</option>${['Vinícius','João','Matheus','Pedro'].map(x=>`<option ${D.barber===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn ghost" data-lock>⌾</button></div></header><section class="content">${body}</section></main><nav class="bottom">${nav('today','⌂ Hoje')}${nav('clients','◎ Clientes')}${nav('results','↗ Resultados')}</nav></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{D.tab=b.dataset.tab;render()});document.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>{sessionStorage.removeItem('bv_auth');auth=false;gate()});document.querySelector('#barber').onchange=e=>{D.barber=e.target.value;render()}}function card(c,pass=false){return `<article class="card"><div class="who"><div class="av">${init(c.name)}</div><div><div class="nm">${c.name}</div><div class="meta">${badge(c)} &nbsp; ${c.barber} · ciclo ${c.cycle} dias</div></div></div><div><div class="ml">Último corte</div><div class="mv">${c.last}</div></div><div><div class="ml">Retorno previsto</div><div class="mv">${c.next}</div></div><div class="acts">${pass?'':`<button class="btn sec" data-wa="${c.phone}">WhatsApp</button><button class="btn pri" data-reg="${c.name}">Registrar</button>`}<button class="btn ghost" data-view="${c.name}">Ver</button></div></article>`}function section(t,p,a,pass=false){return `<div class="head"><div><h2>${t}</h2><p>${p}</p></div><span class="badge">${a.length} cliente${a.length===1?'':'s'}</span></div><div class="queue">${a.length?a.map(c=>card(c,pass)).join(''):'<div class="card" style="display:block;text-align:center;color:#708493">Nada pendente aqui agora.</div>'}</div>`}function today(){let cs=filtered(),f=cs.filter(c=>c.status==='first'),s=cs.filter(c=>c.status==='second'),r=cs.filter(c=>c.status==='info'),o=cs.filter(c=>c.status==='ok'),n=f.length+s.length;let body=`<div class="focus"><div><div class="ey" style="color:#7bd0f0">Prioridade do dia</div><h2>Sua fila está pronta para trabalhar.</h2><p>Os clientes abaixo entraram no momento certo de contato.</p></div><div><div class="big">${n}</div><div class="biglabel">contatos acionáveis agora</div></div></div><div class="stats"><div class="stat"><div class="l">1ª abordagem</div><div class="v">${f.length}</div><div class="x">entrando na janela</div></div><div class="stat"><div class="l">2ª abordagem</div><div class="v">${s.length}</div><div class="x">sem resposta há 7+ dias</div></div><div class="stat"><div class="l">Responderam</div><div class="v">${r.length}</div><div class="x">no ciclo atual</div></div><div class="stat"><div class="l">Agendados</div><div class="v">${o.length}</div><div class="x">horários ativos</div></div></div>${section('Primeira abordagem','Clientes chegando ao período em que normalmente retornam.',f)}${section('Segunda abordagem','Última tentativa após 7 dias sem resposta.',s)}${section('Já engatilhou','Responderam ou já deixaram horário marcado.',[...r,...o],true)}`;shell(body,'Quem chamar hoje?');bind()}function row(c){return `<article class="clientrow" data-view="${c.name}"><div><div class="nm">${c.name}</div><div class="meta">${c.barber} · ${c.phone}</div></div><div><div class="ml">Último</div><div class="mv">${c.last}</div></div><div><div class="ml">Ciclo</div><div class="mv">${c.cycle} dias</div></div><div>${badge(c)}</div></article>`}function clients(){let body=`<div class="toolbar"><input class="inp" id="q" placeholder="Buscar por nome"><select class="inp" id="st"><option value="all">Todos os status</option><option value="first">1ª abordagem</option><option value="second">2ª abordagem</option><option value="ok">Agendado</option><option value="info">Respondeu</option></select><input class="inp" placeholder="Dia 1 a 5"><button class="btn ghost" id="clear">Limpar</button></div><div class="clientgrid" id="cg">${filtered().map(row).join('')}</div>`;shell(body,'Base de clientes');let q=document.querySelector('#q'),st=document.querySelector('#st');function f(){let x=filtered().filter(c=>!q.value||c.name.toLowerCase().includes(q.value.toLowerCase())).filter(c=>st.value==='all'||c.status===st.value);document.querySelector('#cg').innerHTML=x.map(row).join('');bind()}q.oninput=f;st.onchange=f;document.querySelector('#clear').onclick=()=>{q.value='';st.value='all';f()};bind()}function fr(l,v,w){return `<div class="fr"><span>${l}</span><div class="track"><div class="fill" style="width:${w}%"></div></div><strong>${v}</strong></div>`}function results(){let body=`<div class="focus"><div><div class="ey" style="color:#7bd0f0">Leitura comercial</div><h2>O contato virou movimento?</h2><p>Mostra o que aconteceu depois das abordagens registradas.</p></div><div><div class="big">18</div><div class="biglabel">abordagens neste mês</div></div></div><div class="stats"><div class="stat"><div class="l">Abordagens</div><div class="v">18</div><div class="x">1ª e 2ª tentativas</div></div><div class="stat"><div class="l">Respostas</div><div class="v">8</div><div class="x">44% de resposta</div></div><div class="stat"><div class="l">Agendamentos</div><div class="v">6</div><div class="x">após contato</div></div><div class="stat"><div class="l">Retornos associados</div><div class="v">5</div><div class="x">R$ 225 associados</div></div></div><div class="panelgrid"><div class="panel"><h2>Funil de recorrência</h2><div class="fun">${fr('Abordagens',18,100)}${fr('Respostas',8,44)}${fr('Agendamentos',6,33)}${fr('Comparecimentos',5,28)}</div></div><div class="panel"><h2>Leitura rápida</h2><div class="list"><div class="lr"><span>Taxa de resposta</span><strong>44%</strong></div><div class="lr"><span>Resposta → agenda</span><strong>75%</strong></div><div class="lr"><span>Ticket associado</span><strong>R$ 45</strong></div><div class="lr"><span>Receita associada</span><strong>R$ 225</strong></div></div></div></div>`;shell(body,'Resultados')}function bind(){document.querySelectorAll('[data-wa]').forEach(b=>b.onclick=e=>{e.stopPropagation();window.open(`https://wa.me/${b.dataset.wa}?text=${encodeURIComponent('Fala! Tudo bem? Está chegando naquela época em que você costuma passar por aqui. Se quiser deixar seu corte organizado, é só me chamar 👊')}`,'_blank')});document.querySelectorAll('[data-reg]').forEach(b=>b.onclick=e=>{e.stopPropagation();modal(b.dataset.reg)});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view))}function modal(name){document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="mb"><div class="modal"><div class="mh"><div><div class="ey">Registrar abordagem</div><h3>${name}</h3></div><button class="close" id="x">×</button></div><div class="mb"><div class="msg">Fala, ${name.split(' ')[0]}! Tudo bem? Está chegando naquela época em que você costuma passar por aqui. Se quiser deixar seu corte organizado, é só me chamar 👊</div><div class="choices"><button class="choice" data-out="Sem resposta"><strong>Sem resposta</strong><small>Libera 2ª tentativa em 7 dias.</small></button><button class="choice" data-out="Respondeu"><strong>Respondeu</strong><small>Registra interesse sem horário.</small></button><button class="choice" data-out="Agendou"><strong>Agendou</strong><small>Marca o retorno como convertido.</small></button><button class="choice" data-out="Pausado"><strong>Não é hora agora</strong><small>Para a insistência neste ciclo.</small></button></div></div></div></div>`);document.querySelector('#x').onclick=()=>document.querySelector('#mb').remove();document.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>{let c=D.clients.find(x=>x.name===name);if(b.dataset.out==='Agendou'){c.status='ok';c.label='Agendado'}else if(b.dataset.out==='Respondeu'){c.status='info';c.label='Respondeu'}else if(b.dataset.out==='Sem resposta'&&c.status==='first'){c.status='second';c.label='2ª abordagem'}document.querySelector('#mb').remove();toast('Registro atualizado na demonstração.');render()})}function view(name){let c=D.clients.find(x=>x.name===name);document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="mb"><div class="modal"><div class="mh"><div><div class="ey">Cliente · ${c.barber}</div><h3>${c.name}</h3><div class="meta">${c.phone}</div></div><button class="close" id="x">×</button></div><div class="mb"><div class="stats" style="grid-template-columns:repeat(3,1fr);margin-top:0"><div class="stat"><div class="l">Ciclo</div><div class="v" style="font-size:20px">${c.cycle}d</div></div><div class="stat"><div class="l">Último</div><div class="v" style="font-size:20px">${c.last}</div></div><div class="stat"><div class="l">Previsto</div><div class="v" style="font-size:20px">${c.next}</div></div></div><div class="msg"><strong>Histórico demonstrativo</strong><br>03/08 — Atendimento realizado<br>31/08 — Entrou na janela de retorno<br>02/09 — ${c.label}</div></div></div></div>`);document.querySelector('#x').onclick=()=>document.querySelector('#mb').remove()}function render(){if(!auth)return gate();if(D.tab==='clients')clients();else if(D.tab==='results')results();else today()}render();</script></body></html>
